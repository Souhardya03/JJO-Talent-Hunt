version: 1

applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - rm -f pnpm-workspace.yaml
            - rm -f pnpm-workspace.yml
            - pnpm install
            - pnpm install xlsx
        build:
          commands:
            - pnpm build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*