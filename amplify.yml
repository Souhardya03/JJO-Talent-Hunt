version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        # Use pnpm config to ensure it uses the local store for better caching
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*  # Cache the pnpm store instead of just node_modules